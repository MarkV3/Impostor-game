# Copy this file to cloudflared/config.yml and replace YOUR_DOMAIN
# Requires a Cloudflare account and a domain added to your account.
# After running `cloudflared login` and creating a tunnel, update `tunnel:`
# and `credentials-file:` with your tunnel info.

# Name of your tunnel (e.g., created via: cloudflared tunnel create impostor-game)
tunnel: YOUR_TUNNEL_NAME
# Path to the credentials file that cloudflared generated for your tunnel
credentials-file: /home/YOUR_USER/.cloudflared/YOUR_TUNNEL_ID.json

ingress:
  # Public hostname for the frontend (Vite dev server or production server)
  - hostname: game.YOUR_DOMAIN
    service: http://localhost:5173

  # Public hostname for the Socket.IO server
  - hostname: socket.YOUR_DOMAIN
    service: http://localhost:3001

  # Catch-all
  - service: http_status:404

